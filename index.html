<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<title>Movie Night 🍿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0714;
    --panel: #171029;
    --panel-2: #1f1638;
    --line: #2c2150;
    --text: #f5f0ff;
    --muted: #9d92c4;
    --magenta: #ff2d95;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --grad: linear-gradient(135deg, #ff2d95, #8b5cf6 55%, #22d3ee);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }   /* author display rules must not override hidden */
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(1000px 500px at 85% -10%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(800px 400px at -10% 10%, rgba(255,45,149,.16), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(34,211,238,.12), transparent 60%);
    color: var(--text);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 90px; }
  @media (min-width: 860px) { .wrap { max-width: 880px; } }

  /* ---------- Welcome ---------- */
  #welcome {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px; text-align: center;
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 50% -10%, rgba(139,92,246,.35), transparent 60%),
      radial-gradient(700px 400px at 20% 100%, rgba(255,45,149,.25), transparent 60%),
      radial-gradient(700px 400px at 90% 90%, rgba(34,211,238,.2), transparent 60%);
  }
  #welcome .popcorn { font-size: 64px; filter: drop-shadow(0 0 24px rgba(255,45,149,.5)); }
  #welcome h1 {
    font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 8vw, 44px);
    margin: 0; line-height: 1.1; letter-spacing: .02em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #welcome p { color: var(--muted); margin: 0; font-size: 17px; max-width: 340px; }
  #welcome form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 8px; }
  #welcome input {
    width: 100%; padding: 16px 18px; font-size: 18px; font-family: inherit; text-align: center;
    color: var(--text); background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    outline: none; transition: border-color .2s;
  }
  #welcome input:focus { border-color: var(--violet); }
  #welcome button {
    padding: 16px; font-size: 18px; font-weight: 700; font-family: inherit; color: #fff;
    background: var(--grad); border: none; border-radius: var(--radius); cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,45,149,.35);
    transition: transform .15s;
  }
  #welcome button:active { transform: scale(.97); }

  /* ---------- Header ---------- */
  header.app { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 14px; }
  .logo { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .02em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo .pop { -webkit-text-fill-color: initial; }
  .user-chip {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--text);
  }
  .user-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .user-chip .switch { color: var(--muted); font-size: 12px; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card .label { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }

  .movie-card { display: flex; align-items: center; gap: 12px; }
  .movie-card .marquee { flex: 1; min-width: 0; }
  .poster-thumb {
    flex: none; width: 46px; height: 68px; border-radius: 8px; object-fit: cover;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .poster-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .movie-card .title { font-size: 19px; font-weight: 700; margin-top: 3px; overflow-wrap: break-word; }
  .movie-card .title.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .movie-card .byline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 16px; cursor: pointer;
  }
  .movie-edit { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
  .movie-edit.open { display: flex; }
  .movie-edit input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; font-family: inherit;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .movie-edit input:focus { border-color: var(--violet); }
  .movie-edit .btns { display: flex; gap: 8px; }
  .movie-edit button {
    flex: 1; padding: 10px 14px; border: none; border-radius: 10px; font-family: inherit; font-weight: 700;
    cursor: pointer; font-size: 14px;
  }
  .movie-edit .save { background: var(--grad); color: #fff; }
  .movie-edit .cancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

  .locked-card {
    border: 2px solid transparent;
    background:
      linear-gradient(var(--panel), var(--panel)) padding-box,
      var(--grad) border-box;
    box-shadow: 0 0 24px rgba(255,45,149,.25);
  }
  .locked-card .line { font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 600; margin-top: 5px; }
  .locked-card .sub { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .locked-who { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .locked-who .chip { cursor: default; font-size: 13px; padding: 6px 11px; }
  .locked-out { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .locked-head { display: flex; align-items: center; justify-content: space-between; }
  .details-edit { display: none; flex-direction: column; gap: 8px; margin-top: 12px; }
  .details-edit.open { display: flex; }
  .details-edit input {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .details-edit input:focus { border-color: var(--violet); }
  .details-edit .row { display: flex; gap: 8px; }
  .details-edit .row button {
    flex: 1; padding: 10px; border: none; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .details-save { background: var(--grad); color: #fff; }
  .details-cancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line) !important; }
  .cal-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .cal-btn {
    flex: 1; min-width: 130px; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer;
    text-align: center; text-decoration: none; font-family: inherit; display: block;
  }

  .best-card {
    border: 1px solid transparent;
    background:
      linear-gradient(var(--panel), var(--panel)) padding-box,
      var(--grad) border-box;
    cursor: pointer;
  }
  .best-card .best-line { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .best-card .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .best-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .best-pill {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border: 1px solid transparent; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--text);
    background:
      linear-gradient(var(--panel-2), var(--panel-2)) padding-box,
      var(--grad) border-box;
    transition: transform .15s;
  }
  .best-pill:active { transform: scale(.96); }
  .best-pill .n { font-weight: 400; color: var(--muted); font-size: 13px; }

  .instructions { font-size: 14px; color: var(--muted); margin: 2px 2px 12px; line-height: 1.5; }

  /* ---------- Legend ---------- */
  #legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 14px; cursor: pointer;
    transition: opacity .2s, border-color .2s;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.active { border-color: #fff; }
  .chip .x {
    margin-left: 4px; padding: 2px 4px; color: var(--muted); font-size: 12px; line-height: 1;
    border-radius: 6px;
  }
  .chip .x:active { color: #fff; background: var(--panel-2); }
  #legend.filtering .chip:not(.active) { opacity: .35; }

  .clear-btn {
    display: block; margin: -6px 2px 14px; padding: 0; border: none; background: none;
    color: var(--muted); font-family: inherit; font-size: 13px; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .clear-btn:active { color: var(--text); }

  /* ---------- Calendars ---------- */
  .months { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 860px) { .months { grid-template-columns: 1fr 1fr; align-items: start; } }
  .month { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .month h2 {
    font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 600; margin: 2px 4px 12px; letter-spacing: .02em;
  }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { margin-bottom: 6px; }
  .dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
  .day {
    position: relative; aspect-ratio: 1; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform .1s, box-shadow .2s, opacity .2s;
  }
  .day.blank { background: transparent; border: none; cursor: default; }
  .day.past { opacity: .22; cursor: default; }
  .day.mine {
    color: #fff; border-color: transparent;
    box-shadow: 0 0 14px var(--glow, rgba(255,45,149,.55));
    background: var(--mycolor, var(--magenta));
  }
  .day.best-day { outline: 2px solid #fff; outline-offset: 1px; }
  .day.locked-day {
    background: var(--grad) !important; color: #fff; border-color: transparent;
    font-weight: 800; box-shadow: 0 0 18px rgba(255,45,149,.65);
  }
  .day.dimmed { opacity: .25; }
  .day:not(.past):not(.blank):active { transform: scale(.92); }
  .day .count {
    position: absolute; top: -5px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: var(--grad); color: #fff;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .day .dots { position: absolute; bottom: 4px; display: flex; gap: 3px; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; }

  /* ---------- History ---------- */
  #historyCard { margin-top: 18px; }
  .history-item { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .history-item:first-child { border-top: none; padding-top: 4px; }
  .history-item .h-body { flex: 1; min-width: 0; }
  .history-item .h-title { font-size: 15px; font-weight: 700; overflow-wrap: break-word; }
  .history-item .h-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .history-item .h-who { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: break-word; }
  .history-empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

  /* ---------- Wide buttons (add / cancel outing) ---------- */
  .wide-btn {
    display: block; width: 100%; margin: 18px 0 4px; padding: 14px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--muted); font-family: inherit;
    font-weight: 700; font-size: 14px; cursor: pointer; text-align: center;
    transition: border-color .2s, color .2s, transform .15s;
  }
  .wide-btn:active { border-color: var(--violet); color: var(--text); transform: scale(.98); }

  #addOutingBtn {
    margin-top: 28px; color: var(--text); border: 2px dashed var(--violet); font-size: 15px; padding: 16px;
  }
  #addOutingBtn:disabled { opacity: .6; cursor: wait; }
  .outing-cancel-btn { margin-top: 14px; padding: 11px; font-size: 13px; font-weight: 600; }

  /* ---------- Outings ---------- */
  .outing + .outing { margin-top: 34px; padding-top: 28px; position: relative; }
  .outing + .outing::before {
    content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 2px; border-radius: 2px;
    background: var(--grad); opacity: .7;
  }
  .outing-head {
    display: flex; align-items: baseline; gap: 8px; margin: 0 2px 12px;
    font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  }
  .outing-num { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .outing-when { color: var(--muted); letter-spacing: .04em; }
  .outings-loading { color: var(--muted); text-align: center; padding: 40px 0; font-size: 15px; }

  /* ---------- Save bar ---------- */
  #saveBar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(5,3,12,.85) 30%);
    display: flex; justify-content: center;
    transform: translateY(110%); transition: transform .25s cubic-bezier(.3,1,.4,1);
  }
  #saveBar.show { transform: translateY(0); }
  #saveBtn {
    width: 100%; max-width: 480px; padding: 16px; font-size: 17px; font-weight: 700; font-family: inherit;
    color: #fff; background: var(--grad); border: none; border-radius: var(--radius); cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,45,149,.4);
    transition: transform .15s, opacity .2s;
  }
  #saveBtn:active { transform: scale(.98); }
  #saveBtn:disabled { opacity: .6; cursor: wait; }
  #saveBtn.error { background: linear-gradient(135deg, #ffb020, #f43f5e); }

  /* ---------- Status pill ---------- */
  #status {
    position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); z-index: 40;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
  }
  #status.show { opacity: 1; }
  #status.ok { color: #a3e635; }
  #status.err { color: #ffb020; }

  /* ---------- Bottom sheet ---------- */
  #scrim {
    position: fixed; inset: 0; z-index: 60; background: rgba(5,3,12,.6);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #sheet, #lockSheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
    max-width: 520px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--line); border-bottom: none;
    border-radius: 20px 20px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.3,1,.4,1);
  }
  #sheet.open, #lockSheet.open { transform: translateY(0); }
  #sheet .handle, #lockSheet .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  #sheet h3, #lockSheet h3 { margin: 0 0 12px; font-size: 18px; }
  .who { display: flex; flex-direction: column; gap: 10px; }
  .who .row { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .who .dot { width: 12px; height: 12px; border-radius: 50%; }
  .nobody { color: var(--muted); font-size: 15px; }
  .out { color: var(--muted); font-size: 13px; margin-top: 12px; line-height: 1.5; }
  #lockSheet input {
    width: 100%; margin-top: 14px; padding: 12px 14px; font-size: 16px; font-family: inherit;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  #lockSheet input:focus { border-color: var(--violet); }
  #lockConfirm {
    width: 100%; margin-top: 14px; padding: 15px; border: none; border-radius: 12px;
    font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(255,45,149,.35);
  }
  #lockCancel {
    width: 100%; margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    background: var(--panel-2); color: var(--muted);
  }
  .sheet-lock-btn {
    width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 12px;
    font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .sheet-lock-btn.lock { background: var(--grad); color: #fff; box-shadow: 0 4px 18px rgba(255,45,149,.35); }
  .sheet-lock-btn.unlock { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
</style>
</head>
<body>

<div id="welcome">
  <div class="popcorn">🍿</div>
  <h1>MOVIE NIGHT</h1>
  <p>Tap the evenings you're free. We'll find the night the most of us can make it.</p>
  <form id="nameForm">
    <input id="nameInput" type="text" maxlength="20" placeholder="Your name" autocomplete="off" required>
    <button type="submit">Let's Go 🎬</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="app">
    <div class="logo"><span class="pop">🍿</span> MOVIE NIGHT</div>
    <div class="user-chip" id="userChip" title="Switch name">
      <span class="dot" id="userDot"></span>
      <span id="userName"></span>
      <span class="switch">⇄</span>
    </div>
  </header>

  <p class="instructions">
    <strong>Tap</strong> the evenings you're free, then hit <strong>Save</strong> · tap again to clear · <strong>hold</strong> a day to see who's in.
  </p>

  <div id="legend"></div>
  <div id="outingsLoading" class="outings-loading">Loading the calendar…</div>
  <div id="outings"></div>

  <button id="addOutingBtn" class="wide-btn" hidden>➕ Add another movie outing</button>

  <div class="card" id="historyCard">
    <div class="label">🎞️ Movie Night History</div>
    <div id="historyList"></div>
  </div>
</div>

<template id="outingTpl">
  <section class="outing">
    <div class="outing-head" hidden><span class="outing-num"></span><span class="outing-when"></span></div>

    <div class="card movie-card">
      <img class="poster-thumb movie-poster" alt="" hidden>
      <div class="marquee">
        <div class="label">Now Showing</div>
        <div class="title empty movie-title">No movie picked yet</div>
        <div class="byline movie-byline"></div>
        <div class="movie-edit">
          <input class="in-title" type="text" maxlength="60" placeholder="Movie title">
          <input class="in-poster" type="url" maxlength="300" placeholder="Poster image URL (optional)">
          <input class="in-theater" type="text" maxlength="60" placeholder="Theater (optional)">
          <input class="in-showtime" type="text" maxlength="30" placeholder="Showtime (optional — e.g. 7:45 PM)">
          <div class="btns">
            <button class="save">Set</button>
            <button class="cancel">Cancel</button>
          </div>
        </div>
      </div>
      <button class="icon-btn movie-edit-btn" aria-label="Edit movie">✏️</button>
    </div>

    <div class="card locked-card" hidden>
      <div class="locked-head">
        <div class="label">🎬 It's Official</div>
        <button class="icon-btn details-edit-btn" aria-label="Edit theater and showtime" style="width:34px;height:34px;font-size:14px;">✏️</button>
      </div>
      <div class="line locked-line"></div>
      <div class="sub locked-sub"></div>
      <div class="locked-who"></div>
      <div class="locked-out"></div>
      <div class="details-edit">
        <input class="d-theater" type="text" maxlength="60" placeholder="Theater (e.g. AMC Empire 25)">
        <input class="d-showtime" type="text" maxlength="30" placeholder="Showtime (e.g. 7:45 PM)">
        <div class="row">
          <button class="details-save">Set details</button>
          <button class="details-cancel">Cancel</button>
        </div>
      </div>
      <div class="cal-row">
        <button class="cal-btn ics-btn">📅 Add to calendar</button>
        <a class="cal-btn gcal-btn" target="_blank" rel="noopener">Google Calendar ↗</a>
      </div>
    </div>

    <div class="card best-card" hidden>
      <div class="label">🏆 Best Night</div>
      <div class="best-line"></div>
      <div class="sub best-sub">Tap to see who's in</div>
    </div>

    <button class="clear-btn" hidden>✕ Sitting this one out? Clear my nights</button>

  </section>
</template>

<div id="saveBar"><button id="saveBtn">💾 Save my nights</button></div>

<script>
/* ================= CONFIG =================
   Cloning this for your own group? Replace BIN_ID and ACCESS_KEY
   with your own JSONBin values — see the README for setup steps. */
const CONFIG = {
  BIN_ID: '6a58e2e7da38895dfe662e9b',
  ACCESS_KEY: '$2a$10$2.DP1SWYScTX7fSy2awENOAEw5o.1L2mTUCLsdHXUp40uKJ9Tc1dO',
  HOST_NAME: 'bobby',   // the host can lock in the official night (case-insensitive)
  API: 'https://api.jsonbin.io/v3/b',
  POLL_MS: 45000,       // refresh others' picks while page is open
  PUT_DELAY: 1100,      // gap between the merge GET and the PUT (free tier: 1 req/sec)
  MONTHS: 4             // how many months the calendar shows, starting with the current one
};
const PALETTE = ['#ff2d95','#22d3ee','#a3e635','#ffb020','#8b5cf6','#f43f5e','#14b8a6','#e9d502'];

/* ================= STATE ================= */
let myName = localStorage.getItem('mn_name') || '';
let data = { outings: [], history: [], updatedAt: '' };   // last known bin record
let loaded = false;         // true once the bin has been read at least once
let myDates = {};           // outingId -> Set of my picked dates (local copy)
let dirty = new Set();      // outingIds with unsaved picks
let saving = false;
let filterName = null;
let longPressed = false;
const sections = new Map(); // outingId -> its <section> element
let writeSeq = 0;           // bumps after every successful PUT; a load that started earlier is discarded
let retryTimer = null, retryDelay = 8000;   // one pending retry at a time, with backoff

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => isoOf(new Date());
/* "Over" means before YESTERDAY in this device's time zone, not before today:
   a phone in Tokyo is already on tomorrow while New York is still at the
   movies. Used for archiving and pruning; the calendar still grays out days
   before today. */
const cutoffIso = () => { const d = new Date(); d.setDate(d.getDate() - 1); return isoOf(d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(res => setTimeout(res, ms));
const blankMovie = () => ({ title: '', poster: '', setBy: '', updatedAt: '' });
const newId = () => 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function blankOuting(createdBy) {
  return { id: newId(), createdBy: createdBy || '', createdAt: new Date().toISOString(),
    movie: blankMovie(), availability: {}, lockedDate: '', theater: '', showtime: '' };
}
function hashIdx(name) {
  let h = 0;
  for (const ch of name.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % PALETTE.length;
}
/* Group-wide color assignment: names are sorted deterministically, each takes
   its hash slot or probes to the next free one — so no two members share a
   color (up to 8 people), and every device computes the same result. */
let colorMap = {};
function assignColors() {
  const names = [...new Set(members())]
    .sort((a, b) => { const x = a.toLowerCase(), y = b.toLowerCase(); return x < y ? -1 : x > y ? 1 : 0; });
  const used = new Set();
  colorMap = {};
  for (const n of names) {
    const start = hashIdx(n);
    let slot = start;
    for (let k = 0; k < PALETTE.length; k++) {
      const s = (start + k) % PALETTE.length;
      if (!used.has(s)) { slot = s; break; }
    }
    used.add(slot);
    colorMap[n] = PALETTE[slot];
  }
}
function colorOf(name) { return colorMap[name] || PALETTE[hashIdx(name)]; }
function prettyDate(iso, opts = {}) {
  const [y,m,d] = iso.split('-').map(Number);
  const fmt = { weekday:'short', month:'short', day:'numeric' };
  if (opts.year) fmt.year = 'numeric';
  return new Date(y, m-1, d).toLocaleDateString(undefined, fmt);
}
function outingById(record, id) { return (record.outings || []).find(o => o.id === id); }
function rowOf(o, name) {
  const a = o.availability || {};
  return Object.prototype.hasOwnProperty.call(a, name) && Array.isArray(a[name]) ? a[name] : [];
}
/* Members are everyone who has a row in ANY outing, plus you. Shared across
   outings, so colors, the legend, and "can't make it" lists are consistent. */
function members() {
  const s = new Set();
  for (const o of data.outings) for (const n of Object.keys(o.availability || {})) s.add(n);
  if (myName) s.add(myName);
  return [...s].sort((a, b) => a.localeCompare(b));
}
function isHost() { return !!myName && myName.toLowerCase() === CONFIG.HOST_NAME.toLowerCase(); }
function canCancel(o) {
  return isHost() || (!!myName && !!o.createdBy && o.createdBy.toLowerCase() === myName.toLowerCase());
}
function mySet(o) {
  if (!myDates[o.id]) myDates[o.id] = new Set(rowOf(o, myName));
  return myDates[o.id];
}
/* Your own picks always come from the local copy (which may be unsaved). */
function picksOf(o, name) { return name === myName ? [...mySet(o)] : rowOf(o, name); }
function freeOn(o, iso) { return members().filter(n => picksOf(o, n).includes(iso)); }
function outingLabel(o) {
  const i = data.outings.indexOf(o);
  return (o.movie && o.movie.title) || `Outing ${i + 1}`;
}

/* ================= DATA SHAPE =================
   Older bins stored one outing at the top level (movie, availability,
   lockedDate, theater, showtime). Convert that into outings[0] on read.
   The id is fixed ('o1') so every device converts it identically. */
function normalize(record) {
  record = record || {};
  if (!Array.isArray(record.outings)) {
    record.outings = [{
      id: 'o1', createdBy: '', createdAt: '',
      movie: Object.assign(blankMovie(), record.movie || {}),
      availability: record.availability || {},
      lockedDate: record.lockedDate || '',
      theater: record.theater || '',
      showtime: record.showtime || ''
    }];
  }
  for (const k of LEGACY_KEYS) delete record[k];
  record.outings = record.outings.filter(o => o && typeof o === 'object');
  record.outings.forEach((o, i) => { if (!o.id || typeof o.id !== 'string') o.id = 'x' + i; });
  for (const o of record.outings) {
    o.movie = Object.assign(blankMovie(), o.movie || {});
    o.availability = o.availability || {};
    o.lockedDate = o.lockedDate || '';
    o.theater = o.theater || '';
    o.showtime = o.showtime || '';
    o.createdBy = o.createdBy || '';
  }
  if (!record.outings.length) record.outings.push(Object.assign(blankOuting(''), { id: 'o1' }));
  record.history = Array.isArray(record.history) ? record.history : [];
  return record;
}
/* Pages from before multiple outings read these top-level fields. Every write
   includes them as a harmless stub so a stale open tab loads cleanly (and
   tells its user to refresh) instead of erroring and retrying forever. The
   new page ignores them; `outings` is the real data. */
const LEGACY_KEYS = ['movie', 'availability', 'lockedDate', 'theater', 'showtime'];
const LEGACY_STUB = {
  movie: { title: '⚠️ Movie Night was updated — refresh this page', poster: '', setBy: '', updatedAt: '' },
  availability: {}, lockedDate: '', theater: '', showtime: ''
};
function pruneOld(record) {
  const t = cutoffIso();
  for (const o of record.outings) {
    for (const n of Object.keys(o.availability)) {
      const row = Array.isArray(o.availability[n]) ? o.availability[n] : [];
      o.availability[n] = row.filter(d => d >= t || d === o.lockedDate);
    }
  }
  return record;
}
/* Same as freeOn(), but against an arbitrary record's raw data — used when
   archiving, before the record becomes the global `data`. */
function attendeesOf(o) {
  return Object.keys(o.availability || {})
    .filter(n => rowOf(o, n).includes(o.lockedDate))
    .sort((a, b) => a.localeCompare(b));
}
/* Move every outing whose locked night has passed into history and drop it
   from the board. Mutates `record`; returns the archived outings. Must run
   BEFORE pruneOld(), which would strip the past date and empty the attendees. */
function archiveInto(record) {
  const t = cutoffIso();
  const done = record.outings.filter(o => o.lockedDate && o.lockedDate < t)
    .sort((a, b) => a.lockedDate.localeCompare(b.lockedDate));
  if (!done.length) return [];
  for (const o of done) {
    record.history.unshift({
      date: o.lockedDate, movie: o.movie.title || '', poster: o.movie.poster || '',
      theater: o.theater || '', showtime: o.showtime || '', attendees: attendeesOf(o)
    });
  }
  record.outings = record.outings.filter(o => !done.includes(o));
  // Deterministic id, so two devices wrapping the same night at once agree.
  if (!record.outings.length) record.outings.push(Object.assign(blankOuting(''), { id: 'n' + done[done.length - 1].id }));
  return done;
}

/* ================= API ================= */
async function describeError(r) {
  let detail = '';
  try { detail = (await r.json()).message || ''; } catch (e) {}
  return `${r.status}${detail ? ': ' + detail : ''}`;
}
function fetchT(url, opts = {}) {   // fetch with a 20 s timeout
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}
async function apiGet() {
  const r = await fetchT(`${CONFIG.API}/${CONFIG.BIN_ID}/latest`, { headers: { 'X-Access-Key': CONFIG.ACCESS_KEY } });
  if (!r.ok) throw new Error(`read ${await describeError(r)}`);
  return normalize((await r.json()).record);
}
async function apiPut(record) {
  const r = await fetchT(`${CONFIG.API}/${CONFIG.BIN_ID}`, {
    method: 'PUT',
    headers: { 'X-Access-Key': CONFIG.ACCESS_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({}, record, LEGACY_STUB))
  });
  if (!r.ok) throw new Error(`write ${await describeError(r)}`);
  writeSeq++;
  return record;
}
function goneError() { const e = new Error('that outing was cancelled'); e.gone = true; return e; }

/* ================= SYNC ================= */
/* Bring local picks in line with `data`: forget outings that no longer exist,
   and refresh every outing you have no unsaved changes in. */
function syncMine() {
  const ids = new Set(data.outings.map(o => o.id));
  for (const id of Object.keys(myDates)) if (!ids.has(id)) { delete myDates[id]; dirty.delete(id); }
  for (const id of [...dirty]) if (!ids.has(id)) dirty.delete(id);
  for (const o of data.outings) if (!dirty.has(o.id)) myDates[o.id] = new Set(rowOf(o, myName));
  updateSaveBar();
}
function wrapMessage(done) {
  if (done.length === 1) return `🎬 ${done[0].movie.title || 'Movie night'} is a wrap — saved to History`;
  return `🎬 ${done.length} movie nights wrapped — saved to History`;
}
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setTimeout(() => { retryTimer = null; load({ quiet: true }); }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 120000);
}
async function load({ quiet } = {}) {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  const seq = writeSeq;
  try {
    const fresh = await apiGet();
    if (saving || seq !== writeSeq) return;   // a save landed meanwhile; its result is newer
    const done = archiveInto(fresh);
    if (done.length) {
      if (saving) return;               // a save will archive it with the same result
      saving = true;
      try {
        fresh.updatedAt = new Date().toISOString();
        await wait(CONFIG.PUT_DELAY);
        await apiPut(fresh);
      } finally { saving = false; }
    }
    if (saving || seq + (done.length ? 1 : 0) !== writeSeq) return;
    data = pruneOld(fresh);
    loaded = true;
    retryDelay = 8000;
    syncMine();
    render();
    if (done.length) flashStatus(wrapMessage(done), 'ok', 3500);
    else if (!quiet) flashStatus('Synced ✓', 'ok');
  } catch (e) {
    flashStatus('Can’t reach the calendar — retrying…', 'err', 4000);
    scheduleRetry();
  }
}
function updateSaveBar() {
  const btn = $('saveBtn');
  if (!dirty.size) { $('saveBar').classList.remove('show'); return; }
  let n = 0;
  const t = todayIso();
  for (const id of dirty) for (const d of (myDates[id] || [])) if (d >= t) n++;
  btn.textContent = `💾 Save my nights${n ? ` (${n})` : ''}`;
  $('saveBar').classList.add('show');
}
function markDirty(id) {
  dirty.add(id);
  $('saveBtn').classList.remove('error');
  updateSaveBar();
}
/* The one write path. Re-reads the bin, writes ONLY your own rows in outings
   you changed, applies `mutate(fresh)` for any other edit, then PUTs — so two
   people saving at once can't wipe each other out. Returns true on success. */
async function save(mutate, okMsg) {
  while (saving) await wait(150);   // one write at a time; later edits wait their turn
  saving = true;
  const btn = $('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  let ok = false, gone = false;
  try {
    const fresh = await apiGet();
    const done = archiveInto(fresh);
    pruneOld(fresh);
    const t = cutoffIso();
    const wrapped = new Set(done.map(o => o.id));
    let lost = 0, lostWrapped = 0;
    const written = {};   // what we sent per outing, to spot taps made while saving
    for (const id of dirty) {
      const o = outingById(fresh, id);
      written[id] = [...(myDates[id] || [])].sort().join(',');
      if (o) o.availability[myName] = [...(myDates[id] || [])].filter(d => d >= t).sort();
      else if (wrapped.has(id)) lostWrapped++;
      else lost++;
    }
    if (mutate) mutate(fresh);
    fresh.updatedAt = new Date().toISOString();
    await wait(CONFIG.PUT_DELAY);
    await apiPut(fresh);
    data = fresh;
    loaded = true;
    // Clear only outings whose picks are exactly what we sent; a tap made
    // during the save stays unsaved instead of being wiped.
    for (const id of [...dirty]) {
      if (id in written && [...(myDates[id] || [])].sort().join(',') === written[id]) dirty.delete(id);
    }
    syncMine();
    render();
    btn.disabled = false;
    if (lost) flashStatus('Saved — but one outing was cancelled, so those picks are gone', 'err', 5000);
    else if (lostWrapped) flashStatus('Saved — one outing’s night already happened, so it moved to History', 'ok', 5000);
    else if (done.length) flashStatus(wrapMessage(done), 'ok', 3500);
    else flashStatus(okMsg || 'Saved ✓ Your nights are in!', 'ok', 2500);
    ok = true;
  } catch (e) {
    btn.disabled = false;
    if (e.gone) {
      flashStatus('Someone cancelled that outing — refreshing', 'err', 4000);
      updateSaveBar();
      gone = true;
    } else {
    if (dirty.size) {
      btn.classList.add('error');
      btn.textContent = '⚠️ Save failed — tap to try again';
      $('saveBar').classList.add('show');
    } else {
      $('saveBar').classList.remove('show');
    }
    if (mutate) {
      // The edit itself (lock, movie details, add/remove…) didn't land: say so
      // and put the screen back to what's really saved.
      flashStatus(`That change didn't save (${e.message}) — please try it again`, 'err', 6000);
      setTimeout(() => { if (!saving) load({ quiet: true }); }, 1500);
    } else {
      flashStatus(`Couldn't save (${e.message})`, 'err', 6000);
    }
    }
  } finally {
    saving = false;
  }
  if (gone) {   // reload after releasing the lock; a queued save may run first, which is fine
    await wait(CONFIG.PUT_DELAY);
    if (!saving) await load({ quiet: true });
  }
  return ok;
}
/* Apply an edit to one outing, both locally (so the screen updates now) and
   inside the save (so it lands on the fresh copy). */
function saveOuting(id, edit, okMsg) {
  const local = outingById(data, id);
  if (local) { edit(local); render(); }
  return save(fresh => {
    const o = outingById(fresh, id);
    if (!o) throw goneError();
    edit(o);
  }, okMsg);
}
async function addOuting() {
  const btn = $('addOutingBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const o = blankOuting(myName);
  const ok = await save(fresh => { fresh.outings.push(o); }, '🎬 New outing added — set the movie, then pick your nights');
  btn.disabled = false;
  if (!ok) return;
  const sec = sections.get(o.id);
  if (sec) {
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    openMovieEdit(sec, o.id);
  }
}
async function cancelOuting(id) {
  const o = outingById(data, id);
  if (!o) return;
  const name = o.movie.title ? `“${o.movie.title}”` : 'this outing';
  if (!confirm(`Cancel ${name}? Its movie details and everyone's picked nights for it will be deleted. (It won't go into History.)`)) return;
  if (!confirm('Are you really sure? This can’t be undone.')) return;
  const prevDates = myDates[id], wasDirty = dirty.has(id);
  delete myDates[id];
  dirty.delete(id);
  const ok = await save(fresh => {
    fresh.outings = fresh.outings.filter(x => x.id !== id);
    if (!fresh.outings.length) fresh.outings.push(Object.assign(blankOuting(''), { id: 'n' + id }));
  }, 'Outing cancelled');
  if (!ok && outingById(data, id)) {           // put local state back if the cancel didn't go through
    if (prevDates) myDates[id] = prevDates;
    if (wasDirty) dirty.add(id);
    updateSaveBar();
  }
}
function removeMember(name) {
  for (const o of data.outings) delete o.availability[name];
  if (filterName === name) filterName = null;
  render();
  save(fresh => { for (const o of fresh.outings) delete o.availability[name]; }, `Removed ${name}`);
}

/* ================= RENDER ================= */
function render() {
  assignColors();
  renderUser(); renderLegend(); renderOutings(); renderHistory();
}
function renderUser() {
  $('userName').textContent = myName;
  $('userDot').style.background = colorOf(myName);
}
function renderLegend() {
  const el = $('legend');
  el.innerHTML = '';
  el.classList.toggle('filtering', !!filterName);
  for (const n of members()) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (filterName === n ? ' active' : '');
    chip.innerHTML = `<span class="dot" style="background:${colorOf(n)}"></span>${esc(n)}${n === myName ? ' (you)' : ''}`;
    chip.onclick = () => { filterName = (filterName === n) ? null : n; render(); };
    if (isHost() && n !== myName) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.title = `Remove ${n}`;
      x.onclick = e => {
        e.stopPropagation();
        if (!confirm(`Remove ${n} from the group completely? Their picks in every outing will be deleted. They can rejoin anytime by entering their name again.`)) return;
        removeMember(n);
      };
      chip.appendChild(x);
    }
    el.appendChild(chip);
  }
}
function renderOutings() {
  const holder = $('outings');
  $('outingsLoading').hidden = loaded;
  const ids = data.outings.map(o => o.id);
  for (const [id, el] of sections) if (!ids.includes(id)) { el.remove(); sections.delete(id); }
  data.outings.forEach((o, i) => {
    let sec = sections.get(o.id);
    if (!sec) { sec = buildSection(o.id); sections.set(o.id, sec); }
    // Only move a section if it's out of place (moving would blur a focused input).
    if (holder.children[i] !== sec) holder.insertBefore(sec, holder.children[i] || null);
    renderOuting(sec, o, i);
  });
  $('addOutingBtn').hidden = !loaded;
}
function renderOuting(sec, o, i) {
  const q = sel => sec.querySelector(sel);
  const many = data.outings.length > 1;
  q('.outing-head').hidden = !many;
  q('.outing-num').textContent = `Outing ${i + 1} of ${data.outings.length}`;
  q('.outing-when').textContent = o.lockedDate ? `· ${prettyDate(o.lockedDate)}` : '';
  renderMovie(sec, o);
  renderLocked(sec, o);
  renderBest(sec, o);
  renderMonths(sec, o);
  const t = todayIso();
  q('.clear-btn').hidden = ![...mySet(o)].some(d => d >= t);
  q('.outing-cancel-btn').hidden = !(many || o.movie.title || o.lockedDate) || !canCancel(o);
}
function renderMovie(sec, o) {
  const q = sel => sec.querySelector(sel);
  const t = q('.movie-title');
  const bits = [];
  if (o.movie.title) {
    t.textContent = o.movie.title;
    t.classList.remove('empty');
    if (o.movie.setBy) bits.push(`picked by ${o.movie.setBy}`);
  } else {
    t.textContent = 'No movie picked yet';
    t.classList.add('empty');
  }
  if (o.theater) bits.push(`📍 ${o.theater}`);
  if (o.showtime) bits.push(o.showtime);
  q('.movie-byline').textContent = bits.join(' · ');
  const posterEl = q('.movie-poster');
  if (o.movie.poster) {
    if (posterEl.getAttribute('src') !== o.movie.poster) posterEl.src = o.movie.poster;
    posterEl.hidden = false;
  } else {
    posterEl.hidden = true;
    posterEl.removeAttribute('src');
  }
}
function renderLocked(sec, o) {
  const q = sel => sec.querySelector(sel);
  const card = q('.locked-card');
  if (!o.lockedDate) { card.hidden = true; return; }
  card.hidden = false;
  const over = o.lockedDate < todayIso();   // the day after: still shown until it's archived
  q('.locked-head .label').textContent = over ? "🎞️ That's a wrap" : "🎬 It's Official";
  q('.cal-row').hidden = over;
  q('.details-edit-btn').hidden = over;
  q('.locked-line').textContent = prettyDate(o.lockedDate) + (o.showtime ? ` · ${o.showtime}` : '');
  const free = freeOn(o, o.lockedDate);
  const out = members().filter(n => !free.includes(n));
  const bits = [o.movie.title || 'Movie TBD'];
  if (o.theater) bits.push(`📍 ${o.theater}`);
  bits.push(`${free.length} going`);
  if (isHost() && !over) bits.push('hold the day to unlock');
  if (over) bits.push('moves to History tomorrow');
  q('.locked-sub').textContent = bits.join(' · ');
  q('.locked-who').innerHTML = free.map(n =>
    `<span class="chip"><span class="dot" style="background:${colorOf(n)}"></span>${esc(n)}${n === myName ? ' (you)' : ''}</span>`
  ).join('');
  q('.locked-out').textContent = out.length ? `${over ? "Couldn't" : "Can't"} make it: ${out.join(', ')}` : '';
  q('.gcal-btn').href = gcalLink(o);
}
function bestNights(o) {
  const counts = {}, t = todayIso();
  for (const n of members()) for (const d of picksOf(o, n)) if (d >= t) counts[d] = (counts[d] || 0) + 1;
  const max = Math.max(0, ...Object.values(counts));
  if (max < 2) return { max: 0, dates: [] };
  return { max, dates: Object.keys(counts).filter(d => counts[d] === max).sort() };
}
function renderBest(sec, o) {
  const q = sel => sec.querySelector(sel);
  const { max, dates } = bestNights(o);
  const card = q('.best-card');
  if (!dates.length || o.lockedDate) { card.hidden = true; return; }
  card.hidden = false;
  const total = members().length;
  card.dataset.date = dates[0];
  const line = q('.best-line');
  if (isHost()) {
    line.innerHTML = '';
    const pills = document.createElement('div');
    pills.className = 'best-pills';
    for (const d of dates.slice(0, 4)) {
      const pill = document.createElement('button');
      pill.className = 'best-pill';
      pill.innerHTML = `🔓 ${esc(prettyDate(d))} <span class="n">${freeOn(o, d).length} of ${total}</span>`;
      pill.onclick = e => { e.stopPropagation(); openLockSheet(o.id, d); };
      pills.appendChild(pill);
    }
    line.appendChild(pills);
    q('.best-sub').textContent = dates.length > 4
      ? `+${dates.length - 4} more tied — hold a day to lock a different night`
      : `You're the host — tap a night to lock it in for the group`;
  } else {
    const shown = dates.slice(0, 3).map(d => prettyDate(d)).join('  ·  ');
    const extra = dates.length > 3 ? ` +${dates.length - 3} more` : '';
    line.textContent = `${shown}${extra}`;
    q('.best-sub').textContent = `${max} of ${total} free — tap to see who's in`;
  }
}
function renderMonths(sec, o) {
  const holder = sec.querySelector('.months');
  holder.innerHTML = '';
  const now = new Date();
  const best = new Set(bestNights(o).dates);
  const mine = mySet(o);
  const t = todayIso();
  for (let m = 0; m < CONFIG.MONTHS; m++) {
    const first = new Date(now.getFullYear(), now.getMonth() + m, 1);
    const monthEl = document.createElement('div');
    monthEl.className = 'month';
    monthEl.innerHTML = `<h2>${first.toLocaleDateString(undefined, { month:'long', year:'numeric' })}</h2>
      <div class="dow">${['S','M','T','W','T','F','S'].map(d => `<span>${d}</span>`).join('')}</div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (let i = 0; i < first.getDay(); i++) {
      const b = document.createElement('div'); b.className = 'day blank'; grid.appendChild(b);
    }
    const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = isoOf(new Date(first.getFullYear(), first.getMonth(), d));
      const cell = document.createElement('div');
      cell.className = 'day';
      cell.textContent = d;
      cell.dataset.date = iso;
      const past = iso < t;
      if (past) cell.classList.add('past');
      const free = freeOn(o, iso);
      const isMine = mine.has(iso);
      if (isMine) {
        cell.classList.add('mine');
        const c = colorOf(myName);
        cell.style.setProperty('--mycolor', c);
        cell.style.setProperty('--glow', c + '88');
      }
      if (free.length > 0 && !past) {
        cell.innerHTML += `<span class="count">${free.length}</span>`;
        const others = free.filter(n => n !== myName).slice(0, 4);
        if (others.length) {
          cell.innerHTML += `<span class="dots">${others.map(n => `<i style="background:${colorOf(n)}"></i>`).join('')}</span>`;
        }
      }
      if (best.has(iso) && !past && !o.lockedDate) cell.classList.add('best-day');
      if (iso === o.lockedDate) cell.classList.add('locked-day');
      if (filterName && !past && !free.includes(filterName)) cell.classList.add('dimmed');
      if (!past) attachDayEvents(cell, o.id, iso);
      grid.appendChild(cell);
    }
    monthEl.appendChild(grid);
    holder.appendChild(monthEl);
  }
}
function renderHistory() {
  const holder = $('historyList');
  // Hand-edited entries stay in the bin untouched; ones the page can't show are just skipped.
  const hist = (data.history || []).filter(h => h && typeof h.date === 'string' && /^\d{4}-\d{2}-\d{1,2}$/.test(h.date));
  if (!hist.length) {
    holder.innerHTML = '<div class="history-empty">No past nights yet — this fills in automatically once a movie night wraps up.</div>';
    return;
  }
  holder.innerHTML = hist.map(h => {
    const bits = [];
    if (h.theater) bits.push(`📍 ${esc(h.theater)}`);
    if (h.showtime) bits.push(esc(h.showtime));
    // Always alphabetize for display, regardless of storage order — keeps
    // it neutral no matter how an entry was created (auto-archived or
    // hand-added via the JSONBin dashboard).
    const who = (h.attendees && h.attendees.length)
      ? h.attendees.slice().sort((a, b) => a.localeCompare(b)).map(esc).join(', ')
      : '';
    const poster = h.poster
      ? `<img class="poster-thumb" src="${esc(h.poster)}" alt="" loading="lazy" onerror="this.hidden=true">`
      : `<div class="poster-thumb placeholder">🎬</div>`;
    return `<div class="history-item">
      ${poster}
      <div class="h-body">
        <div class="h-title">${esc((h.movie && h.movie !== LEGACY_STUB.movie.title) ? h.movie : 'Movie TBD')}</div>
        <div class="h-sub">${esc(prettyDate(h.date, { year: true }))}${bits.length ? ' · ' + bits.join(' · ') : ''}</div>
        ${who ? `<div class="h-who">🎟️ ${who}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ---- Calendar export ---- */
function eventTimes(o) {
  const [y, mo, d] = o.lockedDate.split('-').map(Number);
  let h = 19, min = 0;
  const m = (o.showtime || '').match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if (m) {
    h = parseInt(m[1], 10);
    min = m[2] ? parseInt(m[2], 10) : 0;
    const ap = (m[3] || '').toLowerCase();
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    if (!ap && h <= 8) h += 12; // "7:45" on a movie app means evening
  }
  const start = new Date(y, mo - 1, d, h, min);
  const end = new Date(start.getTime() + 3 * 3600 * 1000);
  return { start, end };
}
const fmtCal = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function eventSummary(o) { return 'Movie Night' + (o.movie.title ? ` — ${o.movie.title}` : ''); }
function eventDescription(o) { return `Going: ${freeOn(o, o.lockedDate).join(', ')}`; }
function gcalLink(o) {
  const { start, end } = eventTimes(o);
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: eventSummary(o),
    dates: `${fmtCal(start)}/${fmtCal(end)}`,
    location: o.theater || '',
    details: eventDescription(o)
  });
  return `https://calendar.google.com/calendar/render?${p}`;
}
function downloadICS(o) {
  const { start, end } = eventTimes(o);
  const escICS = s => String(s).replace(/([,;\\])/g, '\\$1');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MovieNight//EN', 'BEGIN:VEVENT',
    `UID:${o.id}-${o.lockedDate}-${Date.now()}@movienight`,
    `DTSTAMP:${fmtCal(new Date())}`,
    `DTSTART:${fmtCal(start)}`,
    `DTEND:${fmtCal(end)}`,
    `SUMMARY:${escICS(eventSummary(o))}`,
    `LOCATION:${escICS(o.theater || '')}`,
    `DESCRIPTION:${escICS(eventDescription(o))}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'movienight.ics';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= OUTING SECTION =================
   Each outing gets one <section>, cloned from #outingTpl the first time it's
   seen and then only updated — so an open edit form survives re-renders and
   background polls. Handlers look the outing up by id at click time. */
function buildSection(id) {
  const sec = $('outingTpl').content.firstElementChild.cloneNode(true);
  sec.dataset.id = id;
  const q = sel => sec.querySelector(sel);
  const cur = () => outingById(data, id);

  q('.movie-edit-btn').onclick = () => openMovieEdit(sec, id);
  q('.movie-edit .cancel').onclick = () => q('.movie-edit').classList.remove('open');
  q('.movie-edit .save').onclick = () => {
    const o = cur(); if (!o) return;
    const was = sec._movieSnap || {};
    const now = { title: q('.in-title').value.trim(), poster: q('.in-poster').value.trim(),
      theater: q('.in-theater').value.trim(), showtime: q('.in-showtime').value.trim() };
    q('.movie-edit').classList.remove('open');
    saveOuting(id, x => applyChanges(x, was, now));
  };

  q('.details-edit-btn').onclick = () => {
    const o = cur(); if (!o) return;
    sec._detailsSnap = { theater: o.theater, showtime: o.showtime };
    q('.d-theater').value = o.theater;
    q('.d-showtime').value = o.showtime;
    q('.details-edit').classList.add('open');
    q('.d-theater').focus();
  };
  q('.details-cancel').onclick = () => q('.details-edit').classList.remove('open');
  q('.details-save').onclick = () => {
    const was = sec._detailsSnap || {};
    const now = { theater: q('.d-theater').value.trim(), showtime: q('.d-showtime').value.trim() };
    q('.details-edit').classList.remove('open');
    saveOuting(id, x => applyChanges(x, was, now));
  };
  q('.ics-btn').onclick = () => { const o = cur(); if (o) downloadICS(o); };

  q('.best-card').onclick = () => { if (!isHost() && q('.best-card').dataset.date) openSheet(id, q('.best-card').dataset.date); };
  q('.clear-btn').onclick = () => {
    const o = cur(); if (!o) return;
    if (!confirm(`Clear all your nights for ${outingLabel(o)}? You can always tap days again if plans change.`)) return;
    mySet(o).clear();
    markDirty(id);
    render();
  };
  q('.outing-cancel-btn').onclick = () => cancelOuting(id);
  return sec;
}
/* Write only the fields the person actually changed in a form, compared with
   what the form showed when it opened — so a form left open while someone
   else edits doesn't put their old values back. */
function applyChanges(x, was, now) {
  const changed = k => k in now && now[k] !== (was[k] || '');
  if (changed('title') || changed('poster')) {
    x.movie = {
      title: changed('title') ? now.title : x.movie.title,
      poster: changed('poster') ? now.poster : x.movie.poster,
      setBy: myName, updatedAt: new Date().toISOString()
    };
  }
  if (changed('theater')) x.theater = now.theater;
  if (changed('showtime')) x.showtime = now.showtime;
}
function openMovieEdit(sec, id) {
  const o = outingById(data, id); if (!o) return;
  const q = sel => sec.querySelector(sel);
  sec._movieSnap = { title: o.movie.title, poster: o.movie.poster, theater: o.theater, showtime: o.showtime };
  q('.in-title').value = o.movie.title;
  q('.in-poster').value = o.movie.poster;
  q('.in-theater').value = o.theater;
  q('.in-showtime').value = o.showtime;
  q('.movie-edit').classList.add('open');
  q('.in-title').focus({ preventScroll: true });
}

/* ================= DAY INTERACTION ================= */
function attachDayEvents(cell, id, iso) {
  let timer = null;
  cell.addEventListener('pointerdown', () => {
    longPressed = false;
    timer = setTimeout(() => { longPressed = true; openSheet(id, iso); }, 450);
  });
  const cancel = () => clearTimeout(timer);
  cell.addEventListener('pointerup', cancel);
  cell.addEventListener('pointerleave', cancel);
  cell.addEventListener('pointercancel', cancel);
  cell.addEventListener('click', () => {
    if (longPressed) { longPressed = false; return; }
    const o = outingById(data, id); if (!o) return;
    const s = mySet(o);
    if (s.has(iso)) s.delete(iso); else s.add(iso);
    markDirty(id);
    render();
  });
  cell.addEventListener('contextmenu', e => e.preventDefault());
}

/* ================= SHEETS ================= */
function sheetTitle(o, iso) {
  return prettyDate(iso) + (data.outings.length > 1 ? ` · ${outingLabel(o)}` : '');
}
function openSheet(id, iso) {
  const o = outingById(data, id); if (!o) return;
  const free = freeOn(o, iso);
  const out = members().filter(n => !free.includes(n));
  $('sheetTitle').textContent = sheetTitle(o, iso);
  $('sheetWho').innerHTML = free.length
    ? free.map(n => `<div class="row"><span class="dot" style="background:${colorOf(n)}"></span>${esc(n)}${n === myName ? ' (you)' : ''}</div>`).join('')
    : '<div class="nobody">Nobody has picked this night yet.</div>';
  $('sheetOut').textContent = out.length ? `Not free: ${out.join(', ')}` : '';
  const lockEl = $('sheetLock');
  lockEl.innerHTML = '';
  if (isHost() && iso >= todayIso()) {
    const btn = document.createElement('button');
    if (o.lockedDate === iso) {
      btn.className = 'sheet-lock-btn unlock';
      btn.textContent = 'Unlock this night ↩';
      btn.onclick = () => { closeSheet(); saveOuting(id, x => { x.lockedDate = ''; }, 'Unlocked'); };
    } else {
      btn.className = 'sheet-lock-btn lock';
      btn.textContent = 'Lock it in 🎬 — this is movie night';
      btn.onclick = () => { closeSheet(); saveOuting(id, x => { x.lockedDate = iso; }, '🎬 Locked! The group sees it now'); };
    }
    lockEl.appendChild(btn);
  }
  $('sheet').classList.add('open');
  $('scrim').classList.add('open');
}
let lockSnap = {};
function openLockSheet(id, iso) {
  const o = outingById(data, id); if (!o) return;
  const free = freeOn(o, iso);
  const out = members().filter(n => !free.includes(n));
  $('lockTitle').textContent = `Lock in ${sheetTitle(o, iso)}?`;
  $('lockWho').innerHTML = free.length
    ? free.map(n => `<div class="row"><span class="dot" style="background:${colorOf(n)}"></span>${esc(n)}${n === myName ? ' (you)' : ''}</div>`).join('')
    : '<div class="nobody">Nobody has picked this night yet.</div>';
  $('lockOut').textContent = out.length ? `Can't make it: ${out.join(', ')}` : 'Everyone can make it 🎉';
  $('lockMovie').value = o.movie.title;
  $('lockPoster').value = o.movie.poster;
  $('lockTheater').value = o.theater;
  $('lockShowtime').value = o.showtime;
  $('lockConfirm').dataset.date = iso;
  $('lockConfirm').dataset.outing = id;
  lockSnap = { title: o.movie.title, poster: o.movie.poster, theater: o.theater, showtime: o.showtime };
  $('lockSheet').classList.add('open');
  $('scrim').classList.add('open');
}
function closeSheet() {
  $('sheet').classList.remove('open');
  $('lockSheet').classList.remove('open');
  $('scrim').classList.remove('open');
}

/* ================= STATUS ================= */
let statusTimer = null;
function showStatus(msg, cls) {
  const el = $('status');
  el.textContent = msg;
  el.className = 'show' + (cls ? ' ' + cls : '');
}
function flashStatus(msg, cls, ms = 1800) {
  showStatus(msg, cls);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => $('status').classList.remove('show'), ms);
}

/* ================= BOOT ================= */
function enterApp() {
  $('welcome').style.display = 'none';
  $('app').hidden = false;
  syncMine();
  render();
  load({ quiet: true });
}
$('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  let name = $('nameInput').value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  const existing = members().find(n => n.toLowerCase() === name.toLowerCase());
  if (existing) name = existing; // "mike" and "Mike" are the same guy
  myName = name;
  localStorage.setItem('mn_name', myName);
  myDates = {};
  enterApp();
});
$('userChip').addEventListener('click', () => {
  if (!confirm('Switch to a different name?')) return;
  localStorage.removeItem('mn_name');
  location.reload();
});
$('saveBtn').addEventListener('click', () => { if (!saving) save(); });
$('addOutingBtn').addEventListener('click', addOuting);
$('lockCancel').addEventListener('click', closeSheet);
$('lockConfirm').addEventListener('click', () => {
  const iso = $('lockConfirm').dataset.date;
  const id = $('lockConfirm').dataset.outing;
  const o = outingById(data, id); if (!o) { closeSheet(); return; }
  const was = lockSnap;
  const now = { poster: $('lockPoster').value.trim(), theater: $('lockTheater').value.trim(), showtime: $('lockShowtime').value.trim() };
  const title = $('lockMovie').value.trim();
  if (title) now.title = title;   // a blank title here means "set it later", not "erase it"
  closeSheet();
  saveOuting(id, x => { applyChanges(x, was, now); x.lockedDate = iso; }, '🎬 Locked! The group sees it now');
});
$('scrim').addEventListener('click', closeSheet);

setInterval(() => { if (!document.hidden && myName && !dirty.size && !saving) load({ quiet: true }); }, CONFIG.POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && myName && !dirty.size && !saving) load({ quiet: true });
});

(async function init() {
  if (myName) { enterApp(); return; }   // enterApp() does the first read
  // New visitor: pre-load so the welcome screen can match "mike" to an existing "Mike"
  try { data = pruneOld(await apiGet()); loaded = true; } catch (e) { /* welcome still works offline */ }
})();
</script>
